[package]
name = "flighttrace-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "FlightTrace command-line entrypoint."

[[bin]]
name = "flighttrace"
path = "src/main.rs"

# Only used when compiling for a Windows target — the build script gates
# on CARGO_CFG_TARGET_OS. The dep still compiles as a build-dep on other
# hosts (tiny cost); the resource-embedding call is skipped.
[build-dependencies]
winresource = "0.1"

[dependencies]
flighttrace-core.workspace = true
flighttrace-demo.workspace = true
flighttrace-storage.workspace = true
flighttrace-api.workspace = true
flighttrace-mavlink.workspace = true
flighttrace-assertions.workspace = true
sqlx.workspace = true

serde_json.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
tokio.workspace = true
axum.workspace = true
