name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build ${{ matrix.target }} backend
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_glob: dist/*.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_glob: dist/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      - name: Validate tag and project versions
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "error: tag is not valid SemVer: $tag" >&2
            exit 1
          fi

          expected="${tag#v}"
          cargo_version="$(awk '
            /^\[workspace\.package\]/ { in_section = 1; next }
            /^\[/ { in_section = 0 }
            in_section && /^version *= *"/ {
              match($0, /"[^"]*"/)
              print substr($0, RSTART + 1, RLENGTH - 2)
              exit
            }
          ' Cargo.toml)"
          web_version="$(node -p "require('./web/package.json').version")"

          [[ "$cargo_version" == "$expected" ]] || {
            echo "error: Cargo version $cargo_version does not match tag $tag" >&2
            exit 1
          }
          [[ "$web_version" == "$expected" ]] || {
            echo "error: web version $web_version does not match tag $tag" >&2
            exit 1
          }

      - name: Build web/dist
        shell: bash
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build flighttrace-cli
        run: cargo build --locked --release --package flighttrace-cli --target ${{ matrix.target }}

      - name: Smoke check Linux binary
        if: runner.os == 'Linux'
        run: ./target/${{ matrix.target }}/release/flighttrace --help

      - name: Smoke check Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\${{ matrix.target }}\release\flighttrace.exe --help

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          package="flighttrace-${version}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          install -m 0755 \
            "target/${{ matrix.target }}/release/flighttrace" \
            "dist/$package/flighttrace"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$package/"
          # Ship the built web UI next to the binary so
          # `flighttrace serve --web-dir ./web-dist` works from the archive.
          cp -R web/dist "dist/$package/web-dist"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $package = "flighttrace-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$package" | Out-Null
          Copy-Item `
            "target/${{ matrix.target }}/release/flighttrace.exe" `
            "dist/$package/flighttrace.exe"
          Copy-Item README.md,LICENSE-MIT,LICENSE-APACHE "dist/$package/"
          Copy-Item -Recurse web/dist "dist/$package/web-dist"
          # Double-click launcher: runs flighttrace.exe with no args (GUI
          # mode) and keeps the terminal open so users see the URL / errors.
          Copy-Item assets/start-flighttrace.bat "dist/$package/start-flighttrace.bat"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error

  desktop-windows:
    name: Build Windows native desktop app
    # Independent of the CLI matrix build; failures here don't block CLI
    # release publishing. See docs/issues/14-windows-desktop-release-artifact.md.
    runs-on: windows-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache Cargo (desktop crate)
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-windows
          workspaces: apps/flighttrace-desktop/src-tauri

      - name: Cache tauri-cli
        id: tauri-cli-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}

      - name: Install tauri-cli
        if: steps.tauri-cli-cache.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version '^2'

      # bundle.resources declares web/dist as a compile-time-validated
      # resource path, so it MUST exist before cargo tauri build runs.
      # This mirrors the desktop-check job in ci.yml.
      - name: Build web/dist
        working-directory: web
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Build Tauri app
        working-directory: apps/flighttrace-desktop/src-tauri
        run: cargo tauri build

      - name: Rename + collect installer artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:GITHUB_REF_NAME.Substring(1)
          $bundleDir = "apps/flighttrace-desktop/src-tauri/target/release/bundle"
          $out = "dist"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          # NSIS setup.exe (small, recommended).
          Get-ChildItem "$bundleDir/nsis/*.exe" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $dst = Join-Path $out "flighttrace-desktop-$version-x86_64-pc-windows-msvc-setup.exe"
              Copy-Item $_.FullName $dst
              Write-Host "collected NSIS installer -> $dst"
            }

          # MSI (group-policy friendly). Both may be produced by
          # `bundle.targets: "all"` — ship both.
          Get-ChildItem "$bundleDir/msi/*.msi" -ErrorAction SilentlyContinue |
            ForEach-Object {
              $dst = Join-Path $out "flighttrace-desktop-$version-x86_64-pc-windows-msvc.msi"
              Copy-Item $_.FullName $dst
              Write-Host "collected MSI installer  -> $dst"
            }

          # Fail loudly if neither format landed — that means Tauri
          # produced an installer we didn't glob for, or the build silently
          # skipped its bundle step.
          if (-not (Get-ChildItem $out)) {
            Write-Error "no Tauri installer produced under $bundleDir"
            exit 1
          }

      - name: Upload desktop installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: release-desktop-windows
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build, desktop-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tag metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        # Cover every CLI + desktop artifact shape produced upstream.
        # `2>/dev/null` swallows the noise when a pattern has zero matches
        # (e.g. no .msi if the Tauri MSI target didn't run); `|| true`
        # keeps the step green in that case. The next release-publish step
        # will still catch a fully-empty artifacts dir.
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( *.tar.gz *.zip *.exe *.msi )
          if (( ${#artifacts[@]} == 0 )); then
            echo "no release artifacts found — refusing to publish an empty release" >&2
            exit 1
          fi
          sha256sum "${artifacts[@]}" > SHA256SUMS
          echo "SHA256SUMS covers ${#artifacts[@]} artifact(s):"
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease+=(--prerelease)
          fi

          notes="$(git tag -l --format='%(contents)' "${GITHUB_REF_NAME}")"
          notes="${notes%%-----BEGIN SSH SIGNATURE-----*}"
          notes="${notes%%-----BEGIN PGP SIGNATURE-----*}"
          if [[ -z "${notes//[[:space:]]/}" ]]; then
            notes="Release ${GITHUB_REF_NAME}"
          fi
          cat > release-notes.md <<EOF
          $notes

          ## Downloads

          Two flavours for Windows, one for Linux:

          - \`flighttrace-<v>-x86_64-pc-windows-msvc.zip\` / \`.tar.gz\` —
            **CLI + web-dist bundle.** Extract, run
            \`flighttrace.exe\` (or \`./flighttrace\`) and the UI opens in
            your default browser. Includes \`start-flighttrace.bat\` for
            one-click launch on Windows.
          - \`flighttrace-desktop-<v>-x86_64-pc-windows-msvc-setup.exe\` /
            \`.msi\` — **native desktop app.** Windows Tauri v2 installer;
            same UI in a native window, no browser. Requires the WebView2
            runtime (preinstalled on Windows 11; on Windows 10 the
            installer will fetch it on first run).

          Both flavours use the same backend, the same React UI, and the
          same local SQLite storage. Pick whichever fits.
          EOF

          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "FlightTrace ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            "${prerelease[@]}"
