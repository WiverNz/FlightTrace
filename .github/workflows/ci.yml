name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new commit on a branch cancels still-running CI for older pushes on the
# same ref — saves Actions minutes during fast iteration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target/
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        run: cargo test --workspace --locked

  web:
    name: Web (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: npm run build
        run: npm run build

      - name: npm run lint
        run: npm run lint

  desktop-check:
    name: Desktop (cargo check)
    # Independent of the rust + web jobs on purpose: the Tauri desktop
    # crate is excluded from the workspace and links webkit2gtk on Linux,
    # so its build reqs are heavier than the rest. Not required for
    # merging — it just tells us when the desktop shell breaks.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flighttrace-desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev \
            libayatana-appindicator3-dev librsvg2-dev pkg-config \
            build-essential curl wget file libssl-dev

      - name: Cache cargo for desktop crate
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/flighttrace-desktop/src-tauri

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo check
        run: cargo check --locked
