[workspace]
resolver = "2"
members = [
    "crates/flighttrace-core",
    "crates/flighttrace-demo",
    "crates/flighttrace-storage",
    "crates/flighttrace-api",
    "crates/flighttrace-mavlink",
    "crates/flighttrace-assertions",
    "crates/flighttrace-cli",
]
# The desktop shell links GTK/webkit at build time on Linux. Excluding it
# keeps `cargo test --workspace` and CI running on machines without those
# system deps installed. See docs/issues/08-tauri-desktop-shell.md.
exclude = ["apps/flighttrace-desktop/src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
uuid = { version = "1", features = ["serde", "v4", "v5"] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
thiserror = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "sqlite",
    "macros",
    "migrate",
] }
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["trace", "cors", "fs"] }
http = "1"
http-body-util = "0.1"
# rust-mavlink 0.18.0; `dialect-common` is the cross-stack default. PX4 also speaks common.
# We only need read-only ingestion, so transport-udp + std + tokio are the minimum features.
mavlink = { version = "0.18", default-features = false, features = [
    "std",
    "tokio",
    "transport-udp",
    "dialect-common",
    "dialect-ardupilotmega",
] }
async-trait = "0.1"

flighttrace-core = { path = "crates/flighttrace-core" }
flighttrace-demo = { path = "crates/flighttrace-demo" }
flighttrace-storage = { path = "crates/flighttrace-storage" }
flighttrace-api = { path = "crates/flighttrace-api" }
flighttrace-mavlink = { path = "crates/flighttrace-mavlink" }
flighttrace-assertions = { path = "crates/flighttrace-assertions" }
